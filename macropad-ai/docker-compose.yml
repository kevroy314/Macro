services:
  macropad-ai:
    build: .
    image: macropad-ai:latest
    container_name: macropad-ai
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${MACROPAD_PORT:-8321}:8321"
    volumes:
      # Shared credentials: host and container use the same .credentials.json so
      # OAuth refreshes stay in sync.
      - ${HOME}/.claude:/home/app/.claude
      # Seed only — see entrypoint.sh.
      - ${HOME}/.claude.json:/seed/claude.json:ro
      - ./data:/data
    # Pin the container's upstream resolvers. Docker's embedded resolver otherwise
    # forwards to whatever the host has at that moment, so a VPN coming up on the
    # Windows host rewrites WSL's resolver and the container's DNS goes with it —
    # which is how an estimate failed with "Unable to connect to API (ENOTIMP)".
    # The agent only ever resolves public names; WebFetch is blocked from private
    # hosts, so nothing here needs the LAN's resolver.
    dns:
      - ${MACROPAD_DNS1:-1.1.1.1}
      - ${MACROPAD_DNS2:-8.8.8.8}
    env_file:
      - ./data/env
    environment:
      MACROPAD_DATA_DIR: /data
      HOME: /home/app
    healthcheck:
      # Matches whichever scheme the entrypoint chose, and accepts the self-signed
      # certificate it would have made.
      test: ["CMD", "python", "-c", "import os,ssl,urllib.request;s='https' if os.path.isfile('/data/tls/cert.pem') else 'http';c=ssl._create_unverified_context();urllib.request.urlopen(f'{s}://127.0.0.1:8321/api/v1/health',context=c if s=='https' else None).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
